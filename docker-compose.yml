name: job-agent

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    # Never expose MongoDB publicly. Host access is restricted to loopback for debugging.
    ports:
      - "${MONGO_HOST_PORT:-127.0.0.1:27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  backend:
    build:
      context: ./backend
    image: job-agent-backend:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside Docker, MongoDB is reached by service name -- never localhost.
      MONGODB_URI: mongodb://mongodb:27017/job_agent
      DOCUMENTS_PATH: /app/documents
      FRONTEND_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./documents:/app/documents:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  worker:
    image: job-agent-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    profiles: ["worker"]
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/job_agent
      DOCUMENTS_PATH: /app/documents
    volumes:
      - ./documents:/app/documents:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal
    # The worker does not expose HTTP; the image-level API healthcheck does not apply.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  # Optional production-style frontend. Development uses `npm run dev` on the host.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: job-agent-frontend:local
    restart: unless-stopped
    profiles: ["frontend"]
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

volumes:
  mongo-data:
    name: job-agent-mongo-data

networks:
  internal:
    driver: bridge
